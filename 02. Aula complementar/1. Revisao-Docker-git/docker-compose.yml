services:

  # Armazenamento de objetos (o "S3 local").
  # As imagens oficiais do MinIO (quay.io/minio e minio/minio) deixaram de ser
  # distribuídas publicamente; por isso usamos a imagem mantida pela Chainguard.
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    user: root                  # evita erro de permissão ao gravar no volume
    ports:
      - "9000:9000"   # API S3 (usada pelos programas)
      - "9001:9001"   # Console web (usada por nós no navegador)
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server --console-address ":9001" /data
    networks:
      rede_fia:

  # Nossa API: recebe pedidos e grava na bronze. Imagem construída a partir de ./api
  # O bucket "bronze" é criado pelo próprio ingestao.py na primeira gravação.
  fiashop-api:
    build: ./api
    image: fiashop-api
    container_name: fiashop-api
    ports:
      - "8000:8000"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET_BRONZE: bronze
    volumes:
      - ./api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - minio
    networks:
      rede_fia:

networks:
  rede_fia:
    driver: bridge

volumes:
  minio_storage: {}